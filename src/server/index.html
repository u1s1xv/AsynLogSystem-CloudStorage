<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星河云盘 - Galaxy Cloud Storage</title>
    <style>
        /* ========== 设计变量（企业级配色） ========== */
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --primary-light: #eff6ff;
            --success: #10b981;
            --success-light: #ecfdf5;
            --warning: #f59e0b;
            --warning-light: #fffbeb;
            --danger: #ef4444;
            --danger-light: #fef2f2;
            --purple: #7c3aed;
            --purple-light: #f5f3ff;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --border-light: #f1f5f9;
            --nav-bg: #0f172a;
            --radius: 10px;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.08);
            --shadow-md: 0 4px 16px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 8px 32px rgba(15, 23, 42, 0.14);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ========== 顶部导航 ========== */
        .topbar {
            background: var(--nav-bg);
            color: #fff;
            padding: 0 32px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: linear-gradient(135deg, #2563eb, #7c3aed);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.4);
        }

        .logo-text {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .logo-sub {
            font-size: 11px;
            color: #94a3b8;
            margin-top: 1px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .server-status {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #cbd5e1;
            background: rgba(255, 255, 255, 0.06);
            padding: 5px 12px;
            border-radius: 999px;
        }

        .server-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.2);
        }

        /* ========== 按钮 ========== */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid transparent;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
            user-select: none;
        }

        .btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .btn-primary {
            background: var(--primary);
            color: #fff;
            box-shadow: var(--shadow-sm);
        }

        .btn-primary:hover:not(:disabled) {
            background: var(--primary-hover);
        }

        .btn-default {
            background: #fff;
            border-color: var(--border);
            color: var(--text-secondary);
        }

        .btn-default:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            background: var(--primary-light);
        }

        .btn-ghost-light {
            background: rgba(255, 255, 255, 0.08);
            color: #e2e8f0;
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-ghost-light:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.16);
        }

        /* ========== 主布局 ========== */
        .container {
            max-width: 1080px;
            width: 100%;
            margin: 0 auto;
            padding: 28px 24px 48px;
            flex: 1;
        }

        /* ========== 统计栏 ========== */
        .stats-bar {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 16px 20px;
            box-shadow: var(--shadow-sm);
        }

        .stat-card .stat-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stat-card .stat-value {
            font-size: 22px;
            font-weight: 600;
            color: var(--text);
        }

        .stat-card .stat-value small {
            font-size: 12px;
            font-weight: 400;
            color: var(--text-muted);
        }

        .stat-card.highlight {
            border-left: 3px solid var(--primary);
        }

        /* ========== 卡片 ========== */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            margin-bottom: 20px;
        }

        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-header .card-title {
            font-size: 15px;
            font-weight: 600;
        }

        .card-header .card-title .badge {
            margin-left: 8px;
            font-size: 12px;
            font-weight: 500;
            background: var(--primary-light);
            color: var(--primary);
            padding: 2px 10px;
            border-radius: 999px;
        }

        .card-body {
            padding: 20px;
        }

        /* ========== 上传区域 ========== */
        .upload-layout {
            display: grid;
            grid-template-columns: 1fr 260px;
            gap: 20px;
            align-items: stretch;
        }

        .dropzone {
            border: 2px dashed var(--border);
            border-radius: var(--radius);
            background: #f8fafc;
            padding: 36px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 180px;
        }

        .dropzone:hover {
            border-color: var(--primary);
            background: var(--primary-light);
        }

        .dropzone.dragover {
            border-color: var(--primary);
            background: var(--primary-light);
            box-shadow: inset 0 0 0 2px rgba(37, 99, 235, 0.15);
        }

        .dropzone .dz-icon {
            font-size: 40px;
            margin-bottom: 10px;
            opacity: 0.85;
        }

        .dropzone .dz-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text);
        }

        .dropzone .dz-hint {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .dropzone .selected-file {
            margin-top: 12px;
            font-size: 13px;
            color: var(--primary);
            background: #fff;
            border: 1px solid var(--border);
            padding: 6px 14px;
            border-radius: 8px;
            max-width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            display: none;
        }

        /* 存储类型选择 */
        .storage-type-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .storage-type-group .group-label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 500;
        }

        .type-option {
            border: 1.5px solid var(--border);
            border-radius: var(--radius);
            padding: 12px 14px;
            cursor: pointer;
            transition: all 0.15s;
            background: #fff;
        }

        .type-option:hover {
            border-color: var(--primary);
        }

        .type-option.active {
            border-color: var(--primary);
            background: var(--primary-light);
            box-shadow: 0 0 0 1px var(--primary) inset;
        }

        .type-option .type-name {
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .type-option .type-desc {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 3px;
            line-height: 1.4;
        }

        /* 上传进度 */
        .progress-wrap {
            display: none;
            margin-top: 14px;
        }

        .progress-wrap.visible {
            display: block;
        }

        .progress-bar {
            height: 8px;
            background: var(--border-light);
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #7c3aed);
            border-radius: 999px;
            transition: width 0.15s ease;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ========== 文件表格 ========== */
        .table-wrapper {
            overflow-x: auto;
        }

        table.file-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .file-table thead th {
            background: #f8fafc;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 12px;
            text-align: left;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
        }

        .file-table tbody td {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-light);
            vertical-align: middle;
        }

        .file-table tbody tr {
            transition: background 0.12s;
        }

        .file-table tbody tr:hover {
            background: #f8fafc;
        }

        .file-table tbody tr:last-child td {
            border-bottom: none;
        }

        .cell-file {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .file-thumb {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            flex-shrink: 0;
            background: var(--border-light);
        }

        .file-thumb.type-pdf {
            background: var(--danger-light);
        }

        .file-thumb.type-image {
            background: var(--primary-light);
        }

        .file-thumb.type-doc {
            background: var(--purple-light);
        }

        .file-thumb.type-archive {
            background: var(--warning-light);
        }

        .file-thumb.type-code {
            background: var(--success-light);
        }

        .file-name-cell {
            font-weight: 500;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 320px;
        }

        .tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 500;
            padding: 3px 10px;
            border-radius: 999px;
            white-space: nowrap;
        }

        .tag-deep {
            background: var(--purple-light);
            color: var(--purple);
        }

        .tag-low {
            background: var(--primary-light);
            color: var(--primary);
        }

        .cell-size,
        .cell-time {
            color: var(--text-secondary);
            white-space: nowrap;
        }

        .cell-time {
            font-size: 12px;
        }

        .btn-download {
            padding: 6px 14px;
            font-size: 12px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--primary);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-download:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }

        .btn-download:disabled {
            opacity: 0.5;
            cursor: wait;
        }

        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 56px 20px;
            color: var(--text-muted);
        }

        .empty-state .es-icon {
            font-size: 52px;
            margin-bottom: 14px;
            opacity: 0.6;
        }

        .empty-state .es-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 6px;
        }

        .empty-state .es-desc {
            font-size: 13px;
        }

        /* ========== Toast 通知 ========== */
        .toast-container {
            position: fixed;
            top: 72px;
            right: 24px;
            z-index: 999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .toast {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #fff;
            border: 1px solid var(--border);
            border-left: 4px solid var(--primary);
            border-radius: 8px;
            box-shadow: var(--shadow-md);
            padding: 12px 18px;
            font-size: 13px;
            color: var(--text);
            min-width: 260px;
            max-width: 380px;
            animation: toastIn 0.25s ease;
        }

        .toast.toast-success {
            border-left-color: var(--success);
        }

        .toast.toast-error {
            border-left-color: var(--danger);
        }

        .toast.toast-warning {
            border-left-color: var(--warning);
        }

        .toast .toast-msg {
            flex: 1;
        }

        .toast .toast-close {
            cursor: pointer;
            color: var(--text-muted);
            font-size: 14px;
            background: none;
            border: none;
            padding: 0 2px;
        }

        @keyframes toastIn {
            from {
                transform: translateX(24px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .toast.out {
            opacity: 0;
            transform: translateX(24px);
            transition: all 0.25s ease;
        }

        /* ========== 页脚 ========== */
        .footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: var(--text-muted);
            border-top: 1px solid var(--border);
            background: #fff;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 860px) {
            .upload-layout {
                grid-template-columns: 1fr;
            }

            .stats-bar {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .topbar {
                padding: 0 16px;
            }

            .container {
                padding: 16px 12px 32px;
            }

            .stats-bar {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat-card {
                padding: 12px 14px;
            }

            .file-table thead {
                display: none;
            }

            .file-table tbody td {
                padding: 10px 14px;
            }

            .cell-time {
                display: none;
            }
        }
    </style>
</head>

<body>
    <!-- ============ 顶部导航 ============ -->
    <header class="topbar">
        <div class="logo">
            <div class="logo-icon">☁️</div>
            <div>
                <div class="logo-text">星河云盘</div>
                <div class="logo-sub">Galaxy Cloud Storage</div>
            </div>
        </div>
        <div class="topbar-actions">
            <div class="server-status" title="服务运行状态">
                <span class="dot"></span> 服务正常
            </div>
            <button class="btn btn-ghost-light" id="refreshBtn">🔄 刷新列表</button>
        </div>
    </header>

    <!-- ============ 主内容区 ============ -->
    <main class="container">

        <!-- 统计栏 -->
        <section class="stats-bar">
            <div class="stat-card highlight">
                <div class="stat-label">文件总数</div>
                <div class="stat-value" id="statTotal">0 <small>个</small></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">总容量</div>
                <div class="stat-value" id="statSize">0 B</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">普通存储</div>
                <div class="stat-value" id="statLow">0 <small>个</small></div>
            </div>
            <div class="stat-card">
                <div class="stat-label">深度存储</div>
                <div class="stat-value" id="statDeep">0 <small>个</small></div>
            </div>
        </section>

        <!-- 上传卡片 -->
        <section class="card">
            <div class="card-header">
                <div class="card-title">📤 文件上传</div>
            </div>
            <div class="card-body">
                <div class="upload-layout">
                    <div>
                        <div class="dropzone" id="dropZone">
                            <div class="dz-icon">📁</div>
                            <div class="dz-title">拖拽文件到此处，或点击选择文件</div>
                            <div class="dz-hint">支持任意格式 · 单个文件</div>
                            <div class="selected-file" id="selectedFile"></div>
                        </div>
                        <input type="file" id="fileInput" style="display:none;">
                        <div class="progress-wrap" id="progressWrap">
                            <div class="progress-bar">
                                <div class="progress-fill" id="progressFill"></div>
                            </div>
                            <div class="progress-info">
                                <span id="progressText">准备上传...</span>
                                <span id="progressPercent">0%</span>
                            </div>
                        </div>
                    </div>
                    <div class="storage-type-group">
                        <div class="group-label">选择存储方式</div>
                        <div class="type-option active" data-type="deep" id="optDeep">
                            <div class="type-name">🗜️ 深度存储</div>
                            <div class="type-desc">服务端压缩后存储，节省空间，下载时自动解压</div>
                        </div>
                        <div class="type-option" data-type="low" id="optLow">
                            <div class="type-name">📦 普通存储</div>
                            <div class="type-desc">原样存储，不压缩，下载速度快</div>
                        </div>
                        <button class="btn btn-primary" id="uploadBtn" style="margin-top:4px;">🚀 开始上传</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- 文件列表 -->
        <section class="card">
            <div class="card-header">
                <div class="card-title">📋 文件列表<span class="badge" id="fileCountBadge">0 个文件</span></div>
                <div style="display:flex;gap:8px;align-items:center;">
                    <span style="font-size:12px;color:var(--text-muted);" id="listRefreshTime"></span>
                </div>
            </div>
            <div class="card-body">
                <!-- 后端注入的原始列表（JS 读取数据后重渲染） -->
                <div id="rawFileList" style="display:none;">{{FILE_LIST}}</div>

                <!-- JS 渲染的表格 -->
                <div class="table-wrapper" id="tableWrapper" hidden>
                    <table class="file-table">
                        <thead>
                            <tr>
                                <th style="width:auto;">文件名称</th>
                                <th style="width:110px;">存储类型</th>
                                <th style="width:100px;">大小</th>
                                <th style="width:190px;">修改时间</th>
                                <th style="width:90px;text-align:right;">操作</th>
                            </tr>
                        </thead>
                        <tbody id="fileTableBody"></tbody>
                    </table>
                </div>

                <!-- 空状态 -->
                <div class="empty-state" id="emptyState" hidden>
                    <div class="es-icon">🗂️</div>
                    <div class="es-title">暂无文件</div>
                    <div class="es-desc">通过上方上传区域上传文件，或使用客户端自动同步</div>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        星河云盘 · 基于异步日志系统的云存储 · 深度存储与浅度存储
    </footer>

    <!-- Toast 容器 -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============ 配置（后端注入） ============
        const config = {
            backendUrl: '{{BACKEND_URL}}'
        };

        // ============ DOM ============
        const $ = (id) => document.getElementById(id);
        const fileInput = $('fileInput');
        const dropZone = $('dropZone');
        const selectedFile = $('selectedFile');
        const uploadBtn = $('uploadBtn');
        const progressWrap = $('progressWrap');
        const progressFill = $('progressFill');
        const progressText = $('progressText');
        const progressPercent = $('progressPercent');
        const optDeep = $('optDeep');
        const optLow = $('optLow');

        let selectedStorageType = 'deep';
        let uploading = false;

        // ============ Toast 通知 ============
        function showToast(type, message, duration = 3000) {
            const icons = { success: '✅', error: '❌', warning: '⚠️', info: 'ℹ️' };
            const container = $('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.innerHTML = `
                <span style="font-size:16px;">${icons[type] || icons.info}</span>
                <span class="toast-msg">${message}</span>
                <button class="toast-close">✕</button>`;
            toast.querySelector('.toast-close').addEventListener('click', () => dismiss(toast));
            container.appendChild(toast);
            setTimeout(() => dismiss(toast), duration);
        }

        function dismiss(toast) {
            if (!toast || toast.classList.contains('out')) return;
            toast.classList.add('out');
            setTimeout(() => toast.remove(), 260);
        }

        // ============ 工具函数 ============
        // UTF-8 安全的 base64（支持中文文件名）
        function utf8Base64(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }

        // 字节数格式化
        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB', 'TB'];
            let i = 0;
            let v = bytes;
            while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
            return v.toFixed(v >= 100 || i === 0 ? 0 : 1) + ' ' + units[i];
        }

        // 解析后端格式化的大小文本（如 "12.34 KB"、"46.00 B"）为字节数
        function parseSize(text) {
            const m = (text || '').trim().match(/^([\d.]+)\s*(B|KB|MB|GB|TB)$/i);
            if (!m) return 0;
            const units = { B: 1, KB: 1024, MB: 1024 ** 2, GB: 1024 ** 3, TB: 1024 ** 4 };
            return parseFloat(m[1]) * (units[m[2].toUpperCase()] || 1);
        }

        // 解析后端 ctime 文本（如 "Wed Aug 16 00:00:00 2026\n"）为中文本地时间
        function formatTime(raw) {
            const t = new Date((raw || '').trim());
            if (isNaN(t.getTime())) return (raw || '').trim();
            const pad = (n) => String(n).padStart(2, '0');
            return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())} ${pad(t.getHours())}:${pad(t.getMinutes())}:${pad(t.getSeconds())}`;
        }

        // 根据文件名判断图标类型
        function fileType(name) {
            const ext = (name.split('.').pop() || '').toLowerCase();
            if (['pdf'].includes(ext)) return { cls: 'type-pdf', icon: '📕' };
            if (['jpg', 'jpeg', 'png', 'gif', 'webp', 'bmp', 'svg', 'ico'].includes(ext)) return { cls: 'type-image', icon: '🖼️' };
            if (['doc', 'docx', 'txt', 'md', 'ppt', 'pptx', 'xls', 'xlsx'].includes(ext)) return { cls: 'type-doc', icon: '📄' };
            if (['zip', 'rar', '7z', 'tar', 'gz', 'bz2'].includes(ext)) return { cls: 'type-archive', icon: '🗜️' };
            if (['c', 'cpp', 'h', 'hpp', 'py', 'java', 'js', 'ts', 'go', 'sh', 'json'].includes(ext)) return { cls: 'type-code', icon: '📝' };
            return { cls: '', icon: '📄' };
        }

        // ============ 文件列表渲染 ============
        function renderFileList() {
            // 从后端注入的 HTML 中提取文件数据
            const rawItems = document.querySelectorAll('#rawFileList .file-item');
            const files = [];

            rawItems.forEach((item) => {
                const spans = item.querySelectorAll('.file-info span');
                if (spans.length < 4) return;
                const name = spans[0].textContent.replace(/^📄/, '').trim();
                const typeEl = item.querySelector('.file-type');
                const isDeep = typeEl && typeEl.textContent.indexOf('深度') !== -1;
                const sizeBytes = parseSize(spans[2].textContent);
                const mtime = formatTime(spans[3].textContent);
                // 从下载按钮的 onclick 中提取 URL
                const btn = item.querySelector('button');
                let url = '';
                const onclick = btn ? btn.getAttribute('onclick') || '' : '';
                const m = onclick.match(/window\.location='([^']+)'/);
                if (m) url = m[1];
                files.push({ name, isDeep, sizeBytes, mtime, url });
            });

            const total = files.length;
            const totalSize = files.reduce((s, f) => s + f.sizeBytes, 0);
            const lowCount = files.filter(f => !f.isDeep).length;
            const deepCount = files.filter(f => f.isDeep).length;

            // 更新统计栏
            $('statTotal').innerHTML = `${total} <small>个</small>`;
            $('statSize').textContent = formatBytes(totalSize);
            $('statLow').innerHTML = `${lowCount} <small>个</small>`;
            $('statDeep').innerHTML = `${deepCount} <small>个</small>`;
            $('fileCountBadge').textContent = `${total} 个文件`;

            // 更新刷新时间
            const now = new Date();
            const pad = (n) => String(n).padStart(2, '0');
            $('listRefreshTime').textContent =
                `更新于 ${now.getHours()}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

            // 渲染表格或空状态
            const tableWrapper = $('tableWrapper');
            const emptyState = $('emptyState');
            const tbody = $('fileTableBody');
            tbody.innerHTML = '';

            if (total === 0) {
                tableWrapper.hidden = true;
                emptyState.hidden = false;
                return;
            }

            files.forEach((f) => {
                const t = fileType(f.name);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="cell-file">
                            <div class="file-thumb ${t.cls}">${t.icon}</div>
                            <span class="file-name-cell" title="${f.name}">${f.name}</span>
                        </div>
                    </td>
                    <td><span class="tag ${f.isDeep ? 'tag-deep' : 'tag-low'}">${f.isDeep ? '🗜️ 深度存储' : '📦 普通存储'}</span></td>
                    <td class="cell-size">${formatBytes(f.sizeBytes)}</td>
                    <td class="cell-time">${f.mtime}</td>
                    <td style="text-align:right;">
                        <button class="btn-download" data-url="${f.url}" ${f.url ? '' : 'disabled'}>⬇️ 下载</button>
                    </td>`;
                tbody.appendChild(tr);
            });

            tableWrapper.hidden = false;
            emptyState.hidden = true;
        }

        // ============ 下载（事件委托，不离开页面） ============
        $('fileTableBody').addEventListener('click', (e) => {
            const btn = e.target.closest('.btn-download');
            if (!btn || btn.disabled) return;
            const url = btn.getAttribute('data-url');
            if (!url) return;

            btn.disabled = true;
            const originText = btn.innerHTML;
            btn.innerHTML = '⏳ 下载中...';

            const a = document.createElement('a');
            a.href = config.backendUrl + url;
            a.download = '';
            document.body.appendChild(a);
            a.click();
            a.remove();

            setTimeout(() => {
                btn.disabled = false;
                btn.innerHTML = originText;
            }, 1500);
        });

        // ============ 存储类型选择 ============
        [optDeep, optLow].forEach((opt) => {
            opt.addEventListener('click', () => {
                [optDeep, optLow].forEach(o => o.classList.remove('active'));
                opt.classList.add('active');
                selectedStorageType = opt.dataset.type;
            });
        });

        // ============ 文件选择 ============
        function handleFiles(files) {
            if (!files || files.length === 0) return;
            const file = files[0];
            selectedFile.textContent = `📄 ${file.name}（${formatBytes(file.size)}）`;
            selectedFile.style.display = 'inline-block';
        }

        fileInput.addEventListener('change', () => handleFiles(fileInput.files));

        // ============ 拖拽上传 ============
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });
        dropZone.addEventListener('click', () => {
            if (!uploading) fileInput.click();
        });

        // ============ 上传（XHR，带进度） ============
        function setUploading(state) {
            uploading = state;
            uploadBtn.disabled = state;
            uploadBtn.textContent = state ? '⏳ 上传中...' : '🚀 开始上传';
            if (state) {
                progressWrap.classList.add('visible');
            } else {
                progressWrap.classList.remove('visible');
                progressFill.style.width = '0%';
                progressPercent.textContent = '0%';
            }
        }

        function uploadFile() {
            if (uploading) return;
            const file = fileInput.files[0];
            if (!file) {
                showToast('warning', '请先选择要上传的文件');
                return;
            }

            const encodedName = utf8Base64(file.name);
            setUploading(true);
            progressText.textContent = `正在上传「${file.name}」...`;

            const xhr = new XMLHttpRequest();
            xhr.open('POST', config.backendUrl + '/upload');
            xhr.setRequestHeader('Content-Type', 'application/octet-stream');
            xhr.setRequestHeader('StorageType', selectedStorageType);
            xhr.setRequestHeader('FileName', encodedName);

            xhr.upload.onprogress = (e) => {
                if (e.lengthComputable && e.total > 0) {
                    const pct = Math.round((e.loaded / e.total) * 100);
                    progressFill.style.width = pct + '%';
                    progressPercent.textContent = pct + '%';
                    progressText.textContent = `正在上传「${file.name}」... ${formatBytes(e.loaded)} / ${formatBytes(e.total)}`;
                }
            };

            xhr.onload = () => {
                if (xhr.status === 200) {
                    progressFill.style.width = '100%';
                    progressPercent.textContent = '100%';
                    showToast('success', `「${file.name}」上传成功`);
                    // 服务端渲染列表，整页刷新以展示新文件
                    setTimeout(() => location.reload(), 900);
                } else {
                    showToast('error', `上传失败：服务器返回 HTTP ${xhr.status}`);
                    setUploading(false);
                }
            };

            xhr.onerror = () => {
                showToast('error', '网络错误：无法连接服务器，请检查后端地址');
                setUploading(false);
            };

            xhr.onabort = () => setUploading(false);
            xhr.send(file);
        }

        uploadBtn.addEventListener('click', uploadFile);

        // ============ 刷新 ============
        $('refreshBtn').addEventListener('click', () => {
            showToast('info', '正在刷新列表...', 1500);
            setTimeout(() => location.reload(), 300);
        });

        // ============ 初始化 ============
        document.addEventListener('DOMContentLoaded', () => {
            renderFileList();
            console.log('🌌 星河云盘已就绪，后端地址:', config.backendUrl);
        });
    </script>
</body>

</html>
